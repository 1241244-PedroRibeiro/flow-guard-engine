info:
  name: 03 Login Failures (Anti-Enumeration)
  type: http
  seq: 3
http:
  method: POST
  url: '{{baseUrl}}/auth/login'
  body:
    type: json
    data: |-
      {
        "email": "notfound@flowguard.industrial",
        "password": "WrongPassword!"
      }
  auth:
    type: none
runtime:
  scripts:
    - type: tests
      code: |-
        test("AC2 - Unknown email returns 401 Unauthorized with exact message", function() {
        	expect(res.getStatus()).to.equal(401);
        	const data = res.getBody();
        	expect(data.message).to.equal("Invalid email or password");
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5