info:
  name: "27 · AC4 · Deactivate sensor (ENGINEER) → 200"
  type: http
  seq: 31
http:
  method: PATCH
  url: "{{baseUrl}}/sensor-nodes/{{sensorDeactivateId}}/deactivate"
  headers:
    - name: Authorization
      value: "Bearer {{engineerToken}}"
runtime:
  scripts:
    - type: tests
      code: |-
        test("200 OK", function() {
          expect(res.getStatus()).to.equal(200);
          const body = res.getBody();
          expect(body.isActive).to.equal(false);
          expect(body.id).to.equal(bru.getEnvVar("sensorDeactivateId"));
        });