info:
  name: "01 · AC1 · Register Sensor (ENGINEER) → 201"
  type: http
  seq: 5
http:
  method: POST
  url: "{{baseUrl}}/sensor-nodes"
  headers:
    - name: Authorization
      value: "Bearer {{engineerToken}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "lineId": "{{fg03LineId}}",
        "serialNumber": "SN-FG03-{{runId}}-ENG",
        "sensorType": "MOTOR_VIBRATION"
      }
runtime:
  scripts:
    - type: tests
      code: |-
        test("201 Created", function() {
          expect(res.getStatus()).to.equal(201);
          const body = res.getBody();
          expect(body.serialNumber).to.equal(`SN-FG03-${bru.getEnvVar("runId")}-ENG`.toUpperCase());
          expect(body.sensorType).to.equal("MOTOR_VIBRATION");
          expect(body.isActive).to.equal(true);
          expect(body.thresholdRule).to.equal(null);
          expect(body.lastCalibratedAt).to.equal(null);
          expect(body.lineId).to.equal(bru.getEnvVar("fg03LineId"));
          bru.setEnvVar("sensorPrimaryId", body.id);
        });