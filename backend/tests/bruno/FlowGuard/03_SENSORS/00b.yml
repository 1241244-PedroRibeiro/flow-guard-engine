info:
  name: "00b · Login Operator"
  type: http
  seq: 2
http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "email": "{{operatorEmail}}",
        "password": "{{operatorPassword}}"
      }
runtime:
  scripts:
    - type: tests
      code: |-
        test("200 OK", function() {
          expect(res.getStatus()).to.equal(200);
        });
        test("returns accessToken", function() {
          const body = res.getBody();
          expect(body.accessToken).to.be.a("string");
          expect(body.user.roles).to.include("OPERATOR");
          bru.setEnvVar("operatorToken", body.accessToken);
        });