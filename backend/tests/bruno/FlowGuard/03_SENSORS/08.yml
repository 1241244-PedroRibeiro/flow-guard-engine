info:
  name: "08 · AC1 · Duplicate serialNumber (exact) → 409"
  type: http
  seq: 12
http:
  method: POST
  url: "{{baseUrl}}/sensor-nodes"
  headers:
    - name: Authorization
      value: "Bearer {{engineerToken}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "lineId": "{{fg03LineId}}",
        "serialNumber": "SN-FG03-{{runId}}-ENG",
        "sensorType": "MOTOR_VIBRATION"
      }
runtime:
  scripts:
    - type: tests
      code: |-
        test("409 Conflict", function() {
          expect(res.getStatus()).to.equal(409);
          expect(res.getBody().message).to.include("serialNumber");
        });