info:
  name: FG04 List Readings — Paginated
  type: http
  seq: 6
http:
  method: GET
  url: '{{baseUrl}}/sensor-nodes/{{sensorPrimaryId}}/telemetry-readings?page=1&pageSize=10'
  auth:
    type: bearer
    token: '{{adminToken}}'
runtime:
  scripts:
    - type: tests
      code: |-
        test("AC4 — 200 paginated, ordered desc", function() {
          expect(res.getStatus()).to.equal(200);
          const b = res.getBody();
          expect(b.items).to.be.an("array");
          expect(b.page).to.equal(1);
          expect(b.pageSize).to.equal(10);
          expect(b.totalPages).to.be.at.least(1);
          if (b.items.length >= 2) {
            const d0 = new Date(b.items[0].recordedAt).getTime();
            const d1 = new Date(b.items[1].recordedAt).getTime();
            expect(d0).to.be.at.least(d1);
          }
        });