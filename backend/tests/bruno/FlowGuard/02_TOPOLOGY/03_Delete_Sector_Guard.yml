info:
  name: 03 Delete Sector Guard
  type: http
  seq: 3
http:
  method: DELETE
  url: '{{baseUrl}}/plant-sectors/{{testSectorId}}'
  auth:
    type: bearer
    token: '{{adminToken}}'
runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 409 Conflict because line is attached", function() {
          expect(res.getStatus()).to.equal(409);
          expect(res.getBody().message).to.include("referenced by conveyor lines");
        });