info:
  name: 01 Create Sector
  type: http
  seq: 1
http:
  method: POST
  url: '{{baseUrl}}/plant-sectors'
  body:
    type: json
    data: |-
      {
        "sectorCode": "SEC-TEST-{{$randomInt}}",
        "name": "Automated Test Sector",
        "description": "Generated by Bruno"
      }
  auth:
    type: bearer
    token: '{{adminToken}}'
runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 201 Created", function() {
          expect(res.getStatus()).to.equal(201);
        });
        bru.setEnvVar("testSectorId", res.getBody().id);
        bru.setEnvVar("testSectorCode", res.getBody().sectorCode);