info:
  name: FG06 Consume Stock
  type: http
  seq: 2
http:
  method: POST
  url: '{{baseUrl}}/spare-parts/{{sparePartId}}/consume'
  body:
    type: json
    data: |-
      { "units": 3, "reason": "Maintenance repair" }
  auth:
    type: bearer
    token: '{{operatorToken}}'
runtime:
  scripts:
    - type: tests
      code: |-
        test("AC3 — 200 OK, stock decreased", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().stockUnits).to.equal(7);
        });