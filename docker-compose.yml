version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: flowguard_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowguard_user
      POSTGRES_PASSWORD: flowguard_password
      POSTGRES_DB: flowguard_db
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/infrastructure/persistence/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowguard_user -d flowguard_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - flowguard-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flowguard_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3050
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: flowguard_user
      DB_PASSWORD: flowguard_password
      DB_NAME: flowguard_db
      JWT_SECRET: ${JWT_SECRET:-flowguard-default-secret-key-change-in-production-2026}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3050}
    ports:
      - '3050:3050'
    networks:
      - flowguard-network

volumes:
  postgres_data:
    driver: local

networks:
  flowguard-network:
    driver: bridge