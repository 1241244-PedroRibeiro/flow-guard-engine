name: Continuous Integration (CI) - FlowGuard

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  backend-test:
    name: Build, Typecheck & Automated Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment (LTS 20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Clean Dependencies
        run: npm ci

      - name: Verify TypeScript Compilation (Build)
        run: npm run build

      - name: Execute Automated Test Suite (Jest & Supertest)
        run: npm test -- --coverage